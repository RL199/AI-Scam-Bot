# This ensure that downloaded models persist between container restarts

version: "3.8"

services:
  backend:
    volumes:
      # Mount a named volume for Ollama models to persist between restarts
      - ollama_models:/root/.ollama
    environment:
      # Optional: Set Ollama host explicitly
      - OLLAMA_HOST=0.0.0.0:11434
      # Optional: Set model download directory
      - OLLAMA_MODELS=/root/.ollama/models

volumes:
  ollama_models:
    driver: local
