<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Computer Monitor -->
  <rect x="4" y="6" width="20" height="14" rx="2" fill="url(#gradient)" stroke="#1e40af" stroke-width="1"/>
  <rect x="6" y="8" width="16" height="10" fill="#f8fafc" rx="1"/>

  <!-- Monitor Stand -->
  <rect x="13" y="20" width="2" height="4" fill="#64748b"/>
  <rect x="10" y="24" width="8" height="2" rx="1" fill="#64748b"/>

  <!-- Support Icon (Question Mark) -->
  <circle cx="22" cy="10" r="6" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
  <text x="22" y="13" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">?</text>

</svg>
