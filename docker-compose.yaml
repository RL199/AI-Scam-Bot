services:
  database:
    build:
      context: .
      dockerfile: dockers/database.dockerfile
    environment:
      # Secure credential handling - in .env file
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-scambot_db}
      - MYSQL_USER=${MYSQL_USER:-scambot_user}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: on-failure
    networks:
      service_net:
        ipv4_address: 172.18.0.2

  redis:
    image: redis
    ports:
      - "6379:6379"
    restart: on-failure
    networks:
      service_net:
        ipv4_address: 172.18.0.3

  backend:
    build:
      context: .
      dockerfile: dockers/backend.dockerfile
    environment:
      - DATABASE_HOST=database
      - OLLAMA_HOST=http://model:11434
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    restart: on-failure
    networks:
      service_net:
        ipv4_address: 172.18.0.4
    depends_on:
      - database
      - redis
      - model

  # frontend:
  #   build:
  #     context: .
  #     dockerfile: dockers/frontend.dockerfile
  #   ports:
  #     - "3000:3000"
  #   restart: on-failure
  #   networks:
  #     service_net:
  #       ipv4_address: 172.18.0.5
  #   depends_on:
  #     - backend

  model:
    build:
      context: .
      dockerfile: dockers/model.dockerfile
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Set Ollama host explicitly
      - OLLAMA_HOST=0.0.0.0:11434
      # Set model download directory
      - OLLAMA_MODELS=/root/.ollama/models
    restart: on-failure
    networks:
      service_net:
        ipv4_address: 172.18.0.6

volumes:
  mysql_data:
    driver: local
  ollama_models:
    driver: local

networks:
  service_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
